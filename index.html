:root{

  --primary:#2cb34a; --primary-dark:#1f8f39; --primary-soft:#e6f7ea; --sky:#1cb0f6; --sky-dark:#1287c2; --sky-soft:#e3f5fe; --on-primary:#ffffff;

  --ok:#16a34a; --ok-dark:#11803a; --ok-soft:#dcfce7; --bad:#e5383b; --bad-dark:#b8282b; --bad-soft:#fee2e2;
  --g-v:#1d6bff; --g-t:#ea7a00; --g-p:#16a34a; --g-c:#8b3ff0; --g-q:#0891b2; --g-n:#e5383b; --g-h:#a16207; --g-m:#db2777;
  --p1:#0ea5e9; --p2:#22c55e; --p3:#1d6bff; --p4:#8b5cf6; --p5:#f97316;
  --f-ui:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --f-te:"Noto Sans Telugu","Kohinoor Telugu","Telugu Sangam MN",sans-serif;
  --f-ro:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

  --bg:#0b0f17; --surface:#141a24; --card:#161d29; --ink:#f3f4f6; --sub:#9ca3af; --line:#253041; --line2:#334155;
  --primary:#3ccf5c; --primary-dark:#279c42; --primary-soft:#123620; --sky:#38bdf8; --sky-dark:#1a8fc7; --sky-soft:#10283a; --on-primary:#ffffff;
  --gold:#ffc53d; --gold-dark:#d9a21f; --gold-soft:#3a2f12;
  --ok:#34d073; --ok-dark:#22a85a; --ok-soft:#0f2e1c; --bad:#ff5c5f; --bad-dark:#d94043; --bad-soft:#3a1517;
  --g-v:#6ea2ff; --g-t:#ffa24a; --g-p:#4ade80; --g-c:#b794ff; --g-q:#38c6e0; --g-n:#ff6b6e; --g-h:#e6b24a; --g-m:#f472b6;
  color-scheme:dark}}

  --bg:#0b0f17; --surface:#141a24; --card:#161d29; --ink:#f3f4f6; --sub:#9ca3af; --line:#253041; --line2:#334155;
  --primary:#3ccf5c; --primary-dark:#279c42; --primary-soft:#123620; --sky:#38bdf8; --sky-dark:#1a8fc7; --sky-soft:#10283a; --on-primary:#ffffff;

*{box-sizing:border-box}

.banner{border-radius:20px;padding:18px 18px 16px;color:#fff;display:flex;flex-direction:column;gap:4px;margin:12px 0 6px;position:relative;overflow:hidden}

.node.next::after{content:"スタート";position:absolute;top:-34px;background:var(--bg);color:var(--primary);border:2px solid var(--line);border-radius:12px;padding:2px 10px;font-size:13px;font-family:var(--f-ui);font-weight:800;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}

.unitbar{display:flex;gap:10px;margin:18px 0 8px}

.sec{margin:26px 0 10px;font-weight:800;font-size:14px;color:var(--sub);letter-spacing:.04em}

/* 一覧・カード */
h1.vt{font-size:26px;margin:14px 0 14px;font-weight:800}

.deck{display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.deck .num{font-family:var(--f-ro);font-weight:800;width:70px;font-size:14px;color:var(--sub);line-height:1.3}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}

.dots i.k1{background:#bcd2ff}.dots i.k2{background:#77a5ff}.dots i.k3{background:var(--primary)}

/* レッスン画面 */
.sess{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:20;max-width:600px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
.sess-top{display:flex;align-items:center;gap:12px;padding:10px max(20px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px))}
.sbar{flex:1;height:16px;background:var(--line);border-radius:8px;overflow:hidden}

.opts{display:grid;gap:12px}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:18px;padding:14px 16px;text-align:left;box-shadow:0 4px 0 var(--line);display:flex;gap:12px;align-items:center;min-height:60px;font-size:18px;font-weight:600}
.opt .k{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-family:var(--f-ro);color:var(--sub);flex:none;font-weight:800}

.opt.sel{border-color:var(--sky);background:var(--sky-soft);box-shadow:0 4px 0 var(--sky)}

.opt.ok{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 4px 0 var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 4px 0 var(--bad)}
.answer-area{min-height:124px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;padding:10px 0;
  background:repeating-linear-gradient(transparent 0 60px,var(--line) 60px 62px)}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding-top:8px}
.tile{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 12px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;line-height:1.25}

.pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.foot{padding:14px max(20px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));border-top:2px solid var(--line);background:var(--bg)}

.fb{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}

:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

:root[data-theme="dark"]{--hb1:#10261a;--hb2:#0d1a13}
.lvhead{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 0 6px;text-align:center}
.mascot{font-size:64px;line-height:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.12))}
.lvname{font-size:22px;font-weight:800}
.lvsub{font-size:13px;font-weight:700;color:var(--sub);background:var(--bg);border-radius:12px;padding:3px 12px;border:2px solid var(--line)}
.trail{position:relative;display:flex;flex-direction:column;gap:6px;padding:16px 0}
.trail .row{display:flex;justify-content:center;gap:56px}
.topic{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;width:132px;padding:0}
.topic .ic{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:46px;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.14);transition:transform .1s}
.topic:active .ic{transform:translateY(3px)}
.topic .ic.prog::before{content:"";position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(var(--gold) var(--deg),var(--line) 0);-webkit-mask:radial-gradient(circle,transparent 52px,#000 53px);mask:radial-gradient(circle,transparent 52px,#000 53px);border:0}
.topic .ic.cur{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 6px 0 rgba(0,0,0,.14),0 0 0 10px color-mix(in srgb,var(--primary) 22%,transparent)}}
.topic .ic .crown{position:absolute;right:-6px;bottom:-4px;font-size:24px;background:var(--bg);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.topic .lbl{font-size:14px;font-weight:700;line-height:1.3;text-align:center;color:var(--ink)}
.topic .lbl small{display:block;font-size:11px;color:var(--sub);font-weight:700}
.partlbl{align-self:center;margin:18px 0 4px;font-size:13px;font-weight:800;color:var(--sub);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:4px 14px}
.resume{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 32px));background:var(--bg);border:2px solid var(--line);border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.12);display:flex;align-items:center;gap:12px;padding:10px 12px;z-index:5}
.resume .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:28px;flex:none}
.resume .t{flex:1;min-width:0}
.resume .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resume .go{width:52px;height:52px;border-radius:50%;border:0;background:var(--primary);color:#fff;box-shadow:0 4px 0 var(--primary-dark);display:grid;place-items:center;flex:none}
.resume .go svg{width:26px;height:26px}
/* 下から出るシート（ユニットのレッスン一覧） */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;border-radius:26px 26px 0 0;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));max-height:82vh;overflow-y:auto;animation:up .22s ease-out}

.grab{width:44px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.sheet-h{display:flex;gap:14px;align-items:center;margin-bottom:12px}

.sheet-h small{color:var(--sub);font-size:13px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;border:2px solid var(--line);border-radius:18px;padding:12px 14px;background:var(--bg);margin-bottom:10px;text-align:left;box-shadow:0 3px 0 var(--line)}
.lrow .n{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-family:var(--f-ro);background:var(--line);color:var(--sub);flex:none}
.lrow.done .n{background:var(--gold);color:#fff}
.lrow.next{border-color:var(--primary)} .lrow.next .n{background:var(--primary);color:#fff}
.lrow .t{flex:1;min-width:0}
.lrow .t b{display:block;font-size:16px}
.lrow .t small{color:var(--sub);font-size:13px}
.lrow .n svg{width:22px;height:22px}
.xppill{display:inline-flex;align-items:center;gap:6px;background:var(--gold-soft);color:var(--gold-dark);font-weight:900;border-radius:20px;padding:6px 14px;font-family:var(--f-ro);font-size:18px}
.donemascot{font-size:96px;line-height:1;animation:pop .4s}
.perfect{font-size:34px;font-weight:900;color:var(--gold-dark);letter-spacing:.04em}

/* レベル切り替え */
.lvswitch{border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:6px 14px;font-size:20px;font-weight:800;box-shadow:0 3px 0 var(--line);display:inline-flex;gap:6px;align-items:center}
.lvswitch span{color:var(--sub);font-size:14px}
/* 文法カード */
.gram{font-size:16px;line-height:1.8;display:flex;flex-direction:column;gap:12px}
.gram p{margin:0}
.gram h4{margin:4px 0 0;font-size:16px}
.gram .gh{margin:14px 0 2px;font-size:18px;border-left:4px solid var(--sky);padding-left:8px}
.gram .te{font-size:1.1em}
.gram .il-ro{font-size:.8em;color:var(--sub);margin-left:3px}
.gpoint{background:var(--gold-soft);border:2px solid var(--gold);border-radius:16px;padding:12px 14px}
.gpoint b{display:block;margin-bottom:4px}
.gnote{border-radius:14px;padding:10px 12px;background:var(--surface);font-size:15px}
.gnote span{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--sky);border-radius:8px;padding:0 8px;margin-right:6px}
.gnote.n-jp span{background:#1d6bff}.gnote.n-caution span{background:var(--bad)}.gnote.n-culture span{background:#f97316}.gnote.n-tip span{background:var(--ok)}
.gt-title{font-weight:800;font-size:15px}
.gtable{overflow-x:auto;border:2px solid var(--line);border-radius:14px}
.gtable table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.4}
.gtable th{background:var(--surface);padding:8px;text-align:left;font-size:13px;white-space:nowrap}
.gtable td{padding:8px;border-top:1px solid var(--line);vertical-align:top}
.gtable .tcell .te{font-size:18px}
.gtable .tcell[data-say]{cursor:pointer;color:var(--ink)}
.gtable .tcell[data-say]::after{content:" 🔊";font-size:11px;opacity:.6}
.gt-note{font-size:13px;color:var(--sub)}

.bigopt{min-height:76px}

.jtile{font-size:17px;font-weight:600;padding:10px 14px}
.bigspk.sq{width:72px;height:72px;border-radius:22px}

.has-gram .sbody .te [class^="g-"],.has-gram .foot .te [class^="g-"]{text-decoration:underline dotted 2px;text-underline-offset:6px;cursor:help}
.modal-bg{align-items:center;padding:20px}

.modal-b{overflow-y:auto}

.sbar i{background:linear-gradient(90deg,#ffc53d,#ff8a1f)}
.btn.orange{background:#ffa62b;box-shadow:0 4px 0 #d9851a;color:#fff}

.fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(90px + env(safe-area-inset-bottom,0px));width:72px;height:72px;border-radius:50%;border:0;background:#ffa62b;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;z-index:6}

/* ログイン画面 */

/* ===== 仕上げのデザイン（SuperChinese 風：やわらかい影・丸ゴシック・3Dイラスト・街並み） ===== */
:root{
  --bg:#f5f6fb; --card:#ffffff; --surface:#eef0f7; --ink:#1f2433; --sub:#7b8194; --line:#e6e8f0; --line2:#d6d9e4;
  --primary:#ff9a1f; --primary-dark:#e47d00; --primary-soft:#fff2df;
  --sky:#3ea8f5; --sky-dark:#1f86d1; --sky-soft:#e6f4fe;
  --shadow:0 8px 24px rgba(40,50,90,.08); --shadow-s:0 3px 10px rgba(40,50,90,.07);
  --f-ui:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --hb1:#cfeefc;--hb2:#eaf7fd;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10131b;--card:#1a1f2b;--surface:#222838;--ink:#eef0f6;--sub:#9aa1b5;--line:#2a3142;--line2:#384055;--primary:#ffa53a;--primary-dark:#d9821c;--primary-soft:#3a2a12;--shadow:0 8px 24px rgba(0,0,0,.35);--shadow-s:0 3px 10px rgba(0,0,0,.3);--hb1:#102536;--hb2:#121a26}}
:root[data-theme="dark"]{--bg:#10131b;--card:#1a1f2b;--surface:#222838;--ink:#eef0f6;--sub:#9aa1b5;--line:#2a3142;--line2:#384055;--primary:#ffa53a;--primary-dark:#d9821c;--primary-soft:#3a2a12;--shadow:0 8px 24px rgba(0,0,0,.35);--shadow-s:0 3px 10px rgba(0,0,0,.3);--hb1:#102536;--hb2:#121a26}
body{font-family:var(--f-ui);font-weight:500;letter-spacing:.01em}
img.e3d{width:1.15em;height:1.15em;vertical-align:-.2em;object-fit:contain;display:inline-block}
.btn{border-radius:999px;box-shadow:0 6px 14px color-mix(in srgb,var(--primary) 35%,transparent);font-weight:800}
.btn:active{transform:translateY(1px) scale(.99);box-shadow:0 2px 6px color-mix(in srgb,var(--primary) 30%,transparent)}
.btn.ghost{background:var(--card);border:0;color:var(--ink);box-shadow:var(--shadow-s)}
.btn.white{background:#fff;color:var(--primary-dark);box-shadow:var(--shadow-s)}
.btn:disabled{box-shadow:none}
.card,.stat,.urow,.lrow,.opt,.tile,.intro,.reveal,.pill,.deck,.lvswitch{border:0 !important;box-shadow:var(--shadow-s);background:var(--card)}
.card{border-radius:22px}
.pill{border-radius:999px}
.opt{border-radius:20px;border:2px solid transparent !important}
.opt.sel{border-color:var(--sky) !important;background:var(--sky-soft);box-shadow:0 0 0 0 transparent}
.opt.ok{border-color:var(--ok) !important;background:var(--ok-soft)}
.opt.bad{border-color:var(--bad) !important;background:var(--bad-soft)}
.tile{border-radius:14px}
.tile.used{background:var(--surface);box-shadow:none}
/* 上のバーとタブ */
.top{border-bottom:0;background:transparent}
.chip{background:var(--card);border-radius:999px;padding:4px 12px 4px 8px;box-shadow:var(--shadow-s)}
.robtn{border:0;box-shadow:var(--shadow-s);background:var(--card);border-radius:999px;padding:6px 12px}
.robtn.on{background:var(--primary-soft);color:var(--primary-dark)}
.tabs{margin:0 12px calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border:0;border-radius:26px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(40,50,90,.14)}
.tabs button{border-radius:20px;padding:6px 0 4px}
.tabs button.on{background:var(--primary-soft);color:var(--primary-dark)}
#app{background:var(--bg)}
/* ホームの街並み */
.home-bg{background:none;position:relative;isolation:isolate}
.home-bg::before{content:"";position:absolute;inset:0 0 auto 0;height:100%;z-index:-1;background:linear-gradient(180deg,var(--hb1) 0%,var(--hb2) 420px,var(--bg) 1100px)}
.scene{position:absolute;left:0;right:0;top:120px;height:300px;z-index:-1;opacity:.55;pointer-events:none}
.scene svg{width:100%;height:100%}
.lvhead .mascot{font-size:78px}
.lvswitch{border-radius:999px;padding:8px 18px}
.lvsub{border:0;box-shadow:var(--shadow-s)}
.partlbl{border:0;box-shadow:var(--shadow-s);background:var(--card)}
.trail{position:relative}
.trail::before{content:"";position:absolute;left:50%;top:40px;bottom:40px;border-left:4px dotted color-mix(in srgb,var(--sky) 45%,transparent);transform:translateX(-50%);z-index:-1}
.topic .ic{background:#fff !important;box-shadow:0 10px 22px rgba(40,50,90,.14);border:6px solid var(--uc,#fff)}
.topic .ic img.e3d{width:58px;height:58px}
.topic .ic.prog::before{inset:-14px}
.topic .lbl{background:color-mix(in srgb,var(--card) 80%,transparent);border-radius:12px;padding:2px 8px}
.resume{border:0;box-shadow:0 12px 30px rgba(40,50,90,.16);border-radius:24px;bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.resume .go{background:var(--primary);box-shadow:0 6px 14px color-mix(in srgb,var(--primary) 35%,transparent)}
.resume .ic img.e3d,.uhead-ic img.e3d,.sheet-h .ic img.e3d{width:70%;height:70%}
.ihero-e img.e3d{width:150px;height:150px}
.lrow2 .sq img.e3d,.sq.big img.e3d{width:60%;height:60%}

<script>

const $ = (s, el = document) => el.querySelector(s);

/* ============ データ ============ */
let C = null, CLIPS = {};

  C = c; CLIPS = new Proxy({}, { get: (_, id) => (typeof id === "string" && clipSrc(id) && C.items[id]) ? [1] : undefined });
  C.units = [];
  C.levels.forEach(L => L.units.forEach((u, i) => {
    u.level = L.id; u.no = i + 1; C.units.push(u);
    const all = [...new Set(u.lessons.flatMap(l => l.items))].filter(id => C.items[id]);
    if (all.length >= 6) u.lessons.push({ id: u.id + "-t", kind: "test", title: "小テスト", items: all });
  }));
}
const levelOf = id => C.levels.find(L => L.id === id) || C.levels[0];
const curLevel = () => levelOf(S.set.level || 1);
const item = id => C.items[id];

/* ============ 音声（スプライトを Web Audio で切り出して再生） ============ */
// 1つの単語・文 = 1つの音声ファイル（切り出しをしないので、押したものが必ず流れる）
const AUDIO_BASE = window.AUDIO_BASE || "a/";
function clipSrc(id) {
  const m = /^([tqw])(\d{4})(e?)$/.exec(id); if (!m) return null;
  return AUDIO_BASE + (m[1] === "t" ? "t/" + m[2] : m[1] === "q" ? "q/Q" + m[2] : "w/W" + m[2] + m[3]) + ".m4a";
}
const Audio_ = {
  ctx: null, cur: null, cache: {},
  ensure() { if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); } if (this.ctx && this.ctx.state === "suspended") this.ctx.resume(); return this.ctx || true; },
  el(id) { const src = clipSrc(id); if (!src) return null; let a = this.cache[id]; if (!a) { a = new Audio(); a.preload = "auto"; a.src = src; this.cache[id] = a; const keys = Object.keys(this.cache); if (keys.length > 80) delete this.cache[keys[0]]; } return a; },
  preload(ids) { ids.slice(0, 30).forEach(id => this.el(id)); },
  play(id, slow) {
    const a = this.el(id); if (!a) return Promise.resolve(false);
    if (this.cur && this.cur !== a) { try { this.cur.pause(); } catch (e) {} }
    try { a.pause(); a.currentTime = 0; } catch (e) {}
    a.playbackRate = (slow ? 0.72 : 1) * (S.set.rate || 1);
    try { a.preservesPitch = true; a.webkitPreservesPitch = true; } catch (e) {}
    this.cur = a;
    return new Promise(res => {

    });
  },
  tone(kind) {
    if (!S.set.sfx || !this.ensure()) return;
    const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.connect(g); g.connect(this.ctx.destination); o.type = "sine";
    const seq = kind === "ok" ? [[660, 0], [990, .09]] : kind === "done" ? [[523, 0], [659, .1], [784, .2], [1046, .3]] : [[220, 0], [180, .12]];

};

/* ============ 記録（端末内＋claude.ai の自分専用の保存場所） ============ */
const LS = "telugu-drill-v1";
const S = {
  set: { ro: true, sfx: true, rate: 1, goal: 30, auto: true },
  xp: {},          // day -> xp
  done: {},        // lessonId -> best accuracy
  srs: {},         // itemId -> [box, due, wrong, seen]
  miss: {},        // itemId or workbook key -> count
  wbDone: {},      // chapter -> best
  last: null,
};
let DB = null, UID = null, dirty = new Set(), saveTimer = null;
function loadLocal() { try { const j = JSON.parse(window.__NATIVE_STATE__ || localStorage.getItem(LS) || "null"); if (j) Object.assign(S, j, { set: Object.assign(S.set, j.set || {}) }); } catch (e) {} }
function saveLocal() { const j = JSON.stringify(S); try { localStorage.setItem(LS, j); } catch (e) {} try { window.webkit?.messageHandlers?.save?.postMessage(j); } catch (e) {} }
function bucketOf(id) { const m = /^([a-z])(\d+)/.exec(id); return m ? m[1] + Math.floor(+m[2] / 1000) : "x"; }
function markSrs(id) { dirty.add("srs-" + bucketOf(id)); }
function scheduleSave() { S.lastSave = Date.now(); saveLocal(); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1500); Cloud.schedule(); }
async function flush() {
  if (!DB || !UID) return;
  const base = "data/users/" + UID + "/";
  try {
    await DB.doc(base + "profile").set({ set: S.set, xp: S.xp, done: S.done, miss: S.miss, wbDone: S.wbDone, last: S.last, t: Date.now() });
    for (const key of [...dirty]) {
      const b = key.slice(4), part = {};
      for (const id in S.srs) if (bucketOf(id) === b) part[id] = S.srs[id];
      await DB.doc(base + key).set({ m: part });
      dirty.delete(key);
    }
  } catch (e) { /* 次回に保存し直す */ }
}
async function connectStore() {
  try {
    if (!window.claude?.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    DB = db; UID = id;
    const base = "data/users/" + id + "/";
    const prof = await db.doc(base + "profile").get();
    if (prof.exists) {
      const p = prof.data();
      const remoteT = p.t || 0, localT = S.lastSave || 0;
      if (remoteT >= localT) {
        Object.assign(S, { xp: p.xp || {}, done: p.done || {}, miss: p.miss || {}, wbDone: p.wbDone || {}, last: p.last || null });
        S.set = Object.assign(S.set, p.set || {});
        const snap = await db.collection("data/users/" + id).get();
        snap.docs.forEach(d => { if (d.id.startsWith("srs-")) Object.assign(S.srs, d.data().m || {}); });
        saveLocal(); render();
      } else { Object.keys(S.srs).forEach(markSrs); flush(); }
    } else { Object.keys(S.srs).forEach(markSrs); flush(); }
  } catch (e) { /* 端末内の記録だけで続ける */ }
}


/* ============ クラウド保存（Firebase）：ログイン・同期・毎日のバックアップ ============ */
const Cloud = {
  user: null, ready: false, status: "", timer: null, lastBackupDay: null,
  ok() { return !!(window.FIREBASE_CONFIG && window.firebase && firebase.apps); },
  init() {
    if (!this.ok()) return false;
    if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    this.auth = firebase.auth(); this.db = firebase.firestore();
    try { this.db.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (e) {}
    this.auth.onAuthStateChanged(async u => {
      this.user = u; this.ready = true;
      if (u) { await this.pull(); hideLogin(); } else if (!S.set.guest) showLogin();
      render();
    });
    return true;
  },
  ref() { return this.db.collection("users").doc(this.user.uid); },
  async pull() {
    try {
      this.status = "同期中…";
      const snap = await this.ref().get();
      if (snap.exists && snap.data().s) {
        const remote = JSON.parse(snap.data().s);
        mergeInto(S, remote);
      }
      saveLocal(); await this.push(true);
      this.status = "保存済み";
    } catch (e) { this.status = "オフライン（この端末に保存中）"; }
  },
  async push(force) {
    if (!this.user) return;
    try {
      const body = JSON.stringify(S);
      await this.ref().set({ s: body, t: firebase.firestore.FieldValue.serverTimestamp(), v: 1, email: this.user.email || "" }, { merge: true });
      const d = new Date().toISOString().slice(0, 10);
      if (force || this.lastBackupDay !== d) {
        await this.ref().collection("backups").doc(d).set({ s: body, t: firebase.firestore.FieldValue.serverTimestamp() });
        this.lastBackupDay = d;
      }
      this.status = "保存済み " + new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
    } catch (e) { this.status = "オフライン（この端末に保存中・あとで送ります）"; }
  },
  schedule() { if (!this.user) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 3000); },
};
/* 2つの記録をまとめる：どちらかで進んだ分は失わない */
function mergeInto(A, B) {
  if (!B) return;
  for (const d in B.xp || {}) A.xp[d] = Math.max(A.xp[d] || 0, B.xp[d]);
  for (const k in B.done || {}) A.done[k] = Math.max(A.done[k] ?? 0, B.done[k]);
  for (const k in B.wbDone || {}) A.wbDone[k] = Math.max(A.wbDone[k] ?? 0, B.wbDone[k]);
  for (const k in B.miss || {}) A.miss[k] = Math.max(A.miss[k] || 0, B.miss[k]);
  for (const id in B.srs || {}) { const a = A.srs[id], b = B.srs[id]; if (!a || (b[3] || 0) > (a[3] || 0) || ((b[3] || 0) === (a[3] || 0) && b[1] > a[1])) A.srs[id] = b; }
  if ((B.lastSave || 0) > (A.lastSave || 0)) { A.set = Object.assign({}, A.set, B.set || {}); }
  A.lastSave = Math.max(A.lastSave || 0, B.lastSave || 0);
}
function showLogin(msg) {
  if ($("#login")) return;
  const el = document.createElement("div"); el.id = "login"; el.className = "login";
  el.innerHTML = `<div class="login-in"><div class="login-art">🦚</div><h1>テルグ語ドリル</h1><p class="muted">ログインすると、学習の記録がクラウドに保存されて、どの端末でも続きから学べます。</p>
    <button class="gbtn" id="lg-google"><span>G</span>Googleでログイン</button>
    <div class="or"><span>または</span></div>
    <input id="lg-mail" type="email" autocomplete="email" placeholder="メールアドレス">
    <input id="lg-pass" type="password" autocomplete="current-password" placeholder="パスワード（6文字以上）">
    <div class="lg-row"><button class="btn" id="lg-in" style="flex:1">ログイン</button><button class="btn ghost" id="lg-up" style="flex:1">新規登録</button></div>
    <button class="ilinkb" id="lg-reset">パスワードを忘れた</button>
    <div class="lg-msg" id="lg-msg">${esc(msg || "")}</div>
    <button class="ilinkb" id="lg-guest">ログインせずに使う（この端末だけに保存）</button></div>`;
  document.body.appendChild(el);
  const m = t => { $("#lg-msg").textContent = t; };
  const err = e => m(({ "auth/invalid-credential": "メールアドレスかパスワードが違います", "auth/wrong-password": "パスワードが違います", "auth/user-not-found": "このメールアドレスは登録されていません", "auth/email-already-in-use": "このメールアドレスはもう登録されています。ログインしてください", "auth/weak-password": "パスワードは6文字以上にしてください", "auth/invalid-email": "メールアドレスの形が正しくありません", "auth/popup-blocked": "ポップアップが止められました。もう一度押してください", "auth/network-request-failed": "通信できません。電波のある所でもう一度" })[e.code] || "うまくいきませんでした（" + e.code + "）");
  const mail = () => $("#lg-mail").value.trim(), pass = () => $("#lg-pass").value;
  $("#lg-google").onclick = () => { const p = new firebase.auth.GoogleAuthProvider(); Cloud.auth.signInWithPopup(p).catch(e => { if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") Cloud.auth.signInWithRedirect(p); else err(e); }); };
  $("#lg-in").onclick = () => Cloud.auth.signInWithEmailAndPassword(mail(), pass()).catch(err);
  $("#lg-up").onclick = () => Cloud.auth.createUserWithEmailAndPassword(mail(), pass()).catch(err);
  $("#lg-reset").onclick = () => { if (!mail()) return m("メールアドレスを入れてから押してください"); Cloud.auth.sendPasswordResetEmail(mail()).then(() => m("再設定のメールを送りました")).catch(err); };
  $("#lg-guest").onclick = () => { S.set.guest = true; saveLocal(); hideLogin(); };

function hideLogin() { const l = $("#login"); if (l) l.remove(); }

/* ============ 復習の間隔（忘れかけた頃にもう一度） ============ */
const GAPS = [0, 1, 2, 4, 7, 14, 30, 60, 120];
function learn(id) { if (!S.srs[id]) { S.srs[id] = [1, today() + 1, 0, 1]; markSrs(id); } }
function grade(id, ok) {
  const s = S.srs[id] || [0, today(), 0, 0];
  if (ok) { s[0] = Math.min(s[0] + 1, GAPS.length - 1); s[1] = today() + GAPS[s[0]]; }
  else { s[0] = 1; s[1] = today(); s[2]++; S.miss[id] = (S.miss[id] || 0) + 1; }
  s[3]++; S.srs[id] = s; markSrs(id);
}
const dueIds = () => Object.keys(S.srs).filter(id => S.srs[id][1] <= today() && C.items[id]);
const addXp = n => { const d = today(); S.xp[d] = (S.xp[d] || 0) + n; };
function streak() {
  let d = today(), n = 0;
  if (!(S.xp[d] >= 1)) d--;
  while ((S.xp[d] || 0) >= 1) { n++; d--; }
  return n;
}

/* ============ 共通の部品 ============ */
const teH = it => `<span class="te">${it.th}</span>`;
const rubyH = it => it.tiles ? `<span class="rubyline">${it.tiles.map(t => `<ruby class="te">${t[1]}<rt class="ro">${t[2]}</rt></ruby>`).join(" ")}</span>` : `<span class="te">${it.th}</span><br><span class="ro">${it.rh}</span>`;
const roH = it => `<span class="ro">${it.rh}</span>`;
function spkBtn(id, cls = "spk") { return CLIPS[id] ? `<button class="${cls}" data-say="${id}" aria-label="音声">${I.spk}</button>` : ""; }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-say]"); if (b) { e.stopPropagation(); Audio_.play(b.dataset.say, b.dataset.slow === "1"); }
});
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }

/* ============ 問題の作り方 ============ */
function distractJa(id, pool, n = 3) {
  const me = item(id), seen = new Set([me.ja]); const out = [];
  for (const j of shuffle(pool)) { const it = item(j); if (it && it.ja && !seen.has(it.ja) && j !== id) { seen.add(it.ja); out.push(j); if (out.length >= n) break; } }
  return out;
}
function poolFor(id) {
  const it = item(id);
  const same = Object.keys(C.items).filter(k => { const x = C.items[k]; return x.k === it.k && x.ja && k[0] === id[0]; });
  return same;
}
function makeExercises(ids, { introNew = true } = {}) {
  const ex = [];
  const words = ids.filter(id => ["w", "c", "v"].includes(item(id).k));
  const sents = ids.filter(id => ["s", "d"].includes(item(id).k));
  const pool = words.length >= 4 ? words : ids;
  for (const id of words) {
    const isNew = !S.srs[id];
    if (introNew && isNew) ex.push({ t: "intro", id });
    const r = Math.random();
    ex.push({ t: item(id).em && r < .35 ? "pic" : r < .65 ? "mcq" : "listen", id, pool });
  }
  if (words.length >= 4) ex.push({ t: Math.random() < .5 ? "pairs" : "lpairs", ids: pick(words, Math.min(4, words.length)) });
  for (const id of words) if (Math.random() < .5) ex.push({ t: "rev", id, pool });
  for (const id of sents) {
    const it = item(id);
    if (introNew && !S.srs[id] && it.tiles) ex.push({ t: "sintro", id });
    const sp = sents.length >= 4 ? sents : poolFor(id);
    if (it.tiles && it.tiles.length >= 2 && it.tiles.length <= 10) {
      const r = Math.random();
      ex.push({ t: r < .3 ? "tja" : r < .55 ? "build" : r < .75 ? "lbuild" : "srev", id, pool: sp });
    } else ex.push({ t: Math.random() < .5 ? "smcq" : "srev", id, pool: sp });
  }
  // 新出の紹介は前、練習は少し混ぜる
  const intros = ex.filter(e => e.t === "intro" || e.t === "sintro");
  const rest = ex.filter(e => e.t !== "intro" && e.t !== "sintro");

/* ============ レッスンの実行 ============ */
function startLesson(lid) {
  const u = C.units.find(x => x.lessons.some(l => l.id === lid)), l = u.lessons.find(x => x.id === lid);
  Audio_.ensure(); Audio_.preload(l.items);
  let ex;
  if (l.kind === "test") ex = testExercises(l);
  else if (l.kind === "dialogue") ex = dialogueExercises(l);
  else if (l.kind === "grammar") ex = grammarExercises(l);
  else ex = makeExercises(l.items);
  const gram = l.kind === "grammar" ? l.gram.slice(0, 6).join("") : (u.lessons.find(x => x.kind === "grammar")?.gram.slice(0, 6).join("") || null);
  ex.unshift({ t: "splash", kind: l.kind });
  runSession({ title: u.title, ex, kind: "lesson", lesson: l, unit: u, gram: l.kind === "test" ? null : gram, timed: l.kind === "test" ? 15 : 0 });
}
function testExercises(l) {
  const ids = shuffle(l.items).slice(0, 12);
  return ids.map(id => { const it = item(id), r = Math.random(), pool = l.items;
    if (it.k === "s" || it.k === "d") return { t: r < .5 ? "smcq" : "srev", id, pool };
    return { t: it.em && r < .3 ? "pic" : r < .65 ? "mcq" : "listen", id, pool }; });
}
function gramCards(l) {
  // 説明の固まりを、表は1枚ずつ、文章は3つずつのカードに分ける
  const cards = []; let cur = [];
  l.gram.forEach(h => { const isT = h.includes("gtable"); if (isT) { if (cur.length) cards.push(cur); cards.push([h]); cur = []; } else { cur.push(h); if (cur.length >= 3) { cards.push(cur); cur = []; } } });
  if (cur.length) cards.push(cur);
  return cards;
}
function grammarExercises(l) {
  const cards = gramCards(l);
  const ex = cards.map((c, i) => ({ t: "gram", html: c.join(""), title: l.title, i: i + 1, n: cards.length }));
  return ex.concat(makeExercises(l.items));
}
function dialogueExercises(l) {
  const ex = [{ t: "dshow", l }];
  l.items.forEach(id => {
    const it = item(id);
    if (it.who === "あなた" && it.p.split(" ").length <= 10) ex.push({ t: "dbuild", id, l });
    else ex.push({ t: "smcq", id, pool: l.items.length >= 4 ? l.items : poolFor(id), listen: true });
  });
  return ex;
}

let SS = null; // session state
function runSession(cfg) {
  Audio_.ensure();
  SS = { ...cfg, queue: cfg.ex.slice(), total: cfg.ex.filter(e => !["intro", "sintro", "dshow", "gram", "splash"].includes(e.t)).length, right: 0, wrong: 0, combo: 0, best: 0, t0: Date.now(), done: 0, seen: new Set(), xp: 0 };
  const el = document.createElement("div"); el.className = "sess" + (cfg.gram ? " has-gram" : ""); el.id = "sess"; document.body.appendChild(el);
  nextEx();
}
function closeSession() { const s = $("#sess"); if (s) s.remove(); SS = null; render(); }
function sessShell(body, footHtml) {
  const prog = SS.total ? Math.min(1, SS.done / SS.total) : 0;
  $("#sess").innerHTML = `<div class="sess-top"><button class="iconbtn" id="s-x" aria-label="やめる">${I.x}</button><div class="sbar ${SS.combo >= 3 ? "hot" : ""}"><i style="width:${prog * 100}%"></i><span class="combo">${SS.combo >= 3 ? SS.combo + "連続正解！" : ""}</span></div></div>
    <div class="sbody" id="sb">${body}</div><div class="foot" id="sf">${footHtml}</div>`;

}
function nextEx() {
  clearTimeout(SS.timer);
  const e = SS.queue.shift();
  if (!e) return finish();
  SS.cur = e; SS.answered = false;
  RENDER_EX[e.t](e);
  if (SS.timed && !["splash", "intro", "sintro", "gram", "dshow"].includes(e.t)) {
    const sb = $("#sb"); sb.insertAdjacentHTML("afterbegin", `<div class="tbar"><i style="animation-duration:${SS.timed}s"></i></div>`);
    SS.timer = setTimeout(() => { if (SS && !SS.answered && SS.cur === e) { const it = item(e.id); scoreEx(e, false, e.id); answerFoot(false, e, `<div class="muted">時間切れ</div>${it ? `<div>${rubyH(it)}</div><small>${esc(it.ja)}</small>` : ""}`, e.id); } }, SS.timed * 1000);
  }
}

function scoreEx(e, ok, srsId) {
  if (e.retry) { if (ok) SS.done++; }
  else { if (ok) { SS.right++; SS.done++; } else SS.wrong++; }
  if (ok) { SS.combo++; SS.best = Math.max(SS.best, SS.combo); SS.xp += 1 + (SS.combo >= 5 ? 1 : 0); }
  else { SS.combo = 0; SS.queue.push({ ...e, retry: true }); }
  if (srsId) { if (S.srs[srsId] || SS.kind !== "lesson") grade(srsId, ok); else if (!ok) S.miss[srsId] = (S.miss[srsId] || 0) + 1; }

  const cb = $(".combo"); if (cb) cb.textContent = SS.combo >= 3 ? SS.combo + "連続正解！" : "";
  const sb = $(".sbar"); if (sb) sb.classList.toggle("hot", SS.combo >= 3);

    document.querySelectorAll("[data-l]").forEach(el => el.onclick = () => { document.querySelectorAll("[data-l]").forEach(x => x.classList.remove("sel")); el.classList.add("sel"); a = el.dataset.l; Audio_.play(a); tryMatch(); });
    document.querySelectorAll("[data-r]").forEach(el => el.onclick = () => { document.querySelectorAll("[data-r]").forEach(x => x.classList.remove("sel")); el.classList.add("sel"); b = el.dataset.r; tryMatch(); });
    $("#s-next").onclick = nextEx;
  },
  pic(e) {
    const it = item(e.id);
    const others = shuffle((e.pool || []).filter(x => x !== e.id && item(x)?.em && item(x).em !== it.em && item(x).ja !== it.ja));
    const extra = others.length >= 3 ? others.slice(0, 3) : shuffle(Object.keys(C.items).filter(k => C.items[k].em && C.items[k].em !== it.em && C.items[k].k === it.k)).slice(0, 3);
    const opts = shuffle([e.id, ...extra]);
    sessShell(`<div class="qtitle">「${esc(it.ja)}」はどれですか？</div><div class="picgrid">${opts.map(id => `<button class="opt piccard" data-id="${id}"><span class="pe">${item(id).em}</span><span class="te">${item(id).th}</span><span class="ro">${item(id).rh}</span></button>`).join("")}</div>`, checkFoot());
    let sel = null;
    document.querySelectorAll(".piccard").forEach(b => b.onclick = () => { document.querySelectorAll(".piccard").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); sel = b.dataset.id; Audio_.play(sel); $("#s-check").disabled = false; });
    $("#s-check").onclick = () => {
      const ok = sel === e.id; document.querySelectorAll(".piccard").forEach(b => { if (b.dataset.id === e.id) b.classList.add("ok"); else if (b.dataset.id === sel) b.classList.add("bad"); });
      scoreEx(e, ok, e.id); answerFoot(ok, e, `<div>${rubyH(it)}</div><small>${esc(it.ja)}</small>`, e.id); Audio_.play(e.id);
    };
  },
  srev(e) {
    const it = item(e.id), others = distractJa(e.id, e.pool, 2), opts = shuffle([e.id, ...others]);
    sessShell(`<div class="qtitle">正しい訳を選んでください</div><div class="prompt-ja">${esc(it.ja)}</div>
      <div class="opts">${opts.map(id => `<button class="opt bigopt" data-id="${id}"><span>${teH(item(id))}<br>${roH(item(id))}</span></button>`).join("")}</div>`, checkFoot());
    let sel = null;
    document.querySelectorAll(".opt").forEach(b => b.onclick = () => { document.querySelectorAll(".opt").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); sel = b.dataset.id; $("#s-check").disabled = false; });
    $("#s-check").onclick = () => {
      const ok = sel === e.id; document.querySelectorAll(".opt").forEach(b => { if (b.dataset.id === e.id) b.classList.add("ok"); else if (b.dataset.id === sel) b.classList.add("bad"); });
      scoreEx(e, ok, e.id); answerFoot(ok, e, `<div>${rubyH(it)}</div><small>${esc(it.ja)}</small>`, e.id); Audio_.play(e.id);
    };
  },
  tja(e) {
    // テルグ語の文を見て、日本語の単語タイルで訳す（HelloChinese の「訳してください」）
    const it = item(e.id), want = it.tiles.map(t => t[3]);
    const have = new Set(want), extra = [];
    for (const x of shuffle((e.pool || []).filter(y => y !== e.id && item(y)?.tiles))) { const g = shuffle(item(x).tiles.map(t => t[3])).find(w => !have.has(w) && w); if (g) { extra.push(g); have.add(g); } if (extra.length >= 3) break; }
    const bank = shuffle(want.concat(extra)).map((w, i) => ({ w, i }));
    sessShell(`<div class="qtitle">訳してください</div><div class="prompt">${spkBtn(e.id, "bigspk sq")}<div>${teH(it)}<br>${roH(it)}</div></div>
      <div class="answer-area" id="ans"></div><div class="bank" id="bank">${bank.map(t => `<button class="tile jtile" data-i="${t.i}">${esc(t.w)}</button>`).join("")}</div>`, checkFoot());
    autoSay(e.id);
    const picked = [];
    const redraw = () => {
      $("#ans").innerHTML = picked.map((i, k) => `<button class="tile jtile" data-k="${k}">${esc(bank[i].w)}</button>`).join("");
      document.querySelectorAll("#bank .tile").forEach(b => b.classList.toggle("used", picked.includes(+b.dataset.i)));
      document.querySelectorAll("#ans .tile").forEach(b => b.onclick = () => { picked.splice(+b.dataset.k, 1); redraw(); });
      $("#s-check").disabled = !picked.length;
    };
    document.querySelectorAll("#bank .tile").forEach(b => b.onclick = () => { const i = +b.dataset.i; if (!picked.includes(i)) { picked.push(i); redraw(); } });
    $("#s-check").onclick = () => {
      const ok = picked.map(i => bank[i].w).join("|") === want.join("|");
      scoreEx(e, ok, e.id); answerFoot(ok, e, `<div>${rubyH(it)}</div><small>${esc(it.ja)}</small>`, e.id); Audio_.play(e.id);
      document.querySelectorAll(".tile").forEach(b => b.disabled = true);
    };
  },
  gram(e) {
    sessShell(`<div class="newtag" style="background:var(--sky-soft);color:var(--sky-dark)">📖 文法 ${e.i}/${e.n}</div><div class="qtitle">${esc(e.title)}</div><div class="gram pop">${e.html}</div>`,
      `<button class="btn" id="s-next">わかった</button>`);
    $("#s-next").onclick = nextEx;

};

function choiceEx(e, title, showTe, listenOnly) {
  const it = item(e.id), others = distractJa(e.id, e.pool, 3), opts = shuffle([e.id, ...others]);
  const prompt = listenOnly
    ? `<div class="listen-c">${spkBtn(e.id, "bigspk")}<button class="slow" data-say="${e.id}" data-slow="1" aria-label="ゆっくり">${I.turtle}</button></div>`
    : `<div class="prompt">${spkBtn(e.id)}<div>${teH(it)}<br>${roH(it)}</div></div>`;
  sessShell(`<div class="qtitle">${title}</div>${prompt}<div class="opts">${opts.map((id, i) => `<button class="opt" data-id="${id}"><span class="k">${i + 1}</span><span>${esc(item(id).ja)}</span></button>`).join("")}</div>`, checkFoot());
  autoSay(e.id);
  let sel = null;
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => { document.querySelectorAll(".opt").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); sel = b.dataset.id; $("#s-check").disabled = false; });
  $("#s-check").onclick = () => {
    const ok = sel === e.id;
    document.querySelectorAll(".opt").forEach(b => { if (b.dataset.id === e.id) b.classList.add("ok"); else if (b.dataset.id === sel) b.classList.add("bad"); });
    scoreEx(e, ok, e.id);
    answerFoot(ok, e, `<div>${rubyH(it)}</div><small>${esc(it.ja)}</small>`, e.id);
    if (listenOnly || !ok) Audio_.play(e.id);
  };
}

function tilesOf(it) { return it.tiles ? it.tiles.map(t => ({ p: t[0], th: t[1], rh: t[2] })) : it.p.split(/\s+/).map(w => ({ p: w, th: esc(w), rh: "" })); }
function buildEx(e, listenOnly, title) {
  const it = item(e.id), tiles = tilesOf(it);
  const pool = (e.pool || []).filter(x => x !== e.id && item(x));
  const extra = []; const have = new Set(tiles.map(t => t.p));
  for (const x of shuffle(pool)) { for (const t of tilesOf(item(x))) { if (!have.has(t.p) && t.p.length > 1) { extra.push(t); have.add(t.p); break; } } if (extra.length >= Math.min(3, Math.max(1, 8 - tiles.length))) break; }
  const bank = shuffle(tiles.concat(extra)).map((t, i) => ({ ...t, i }));
  const prompt = listenOnly
    ? `<div class="listen-c">${spkBtn(e.id, "bigspk")}<button class="slow" data-say="${e.id}" data-slow="1" aria-label="ゆっくり">${I.turtle}</button></div>`
    : `<div class="prompt-ja">${esc(it.ja)}</div>`;
  sessShell(`<div class="qtitle">${title || (listenOnly ? "聞こえた文を組み立てよう" : "テルグ語に並べかえよう")}</div>${prompt}
    <div class="answer-area" id="ans"></div><div class="bank" id="bank">${bank.map(t => `<button class="tile" data-i="${t.i}"><span class="te">${t.th}</span>${t.rh ? `<span class="ro">${t.rh}</span>` : ""}</button>`).join("")}</div>`, checkFoot());
  if (listenOnly) autoSay(e.id);
  const picked = [];
  const redraw = () => {
    $("#ans").innerHTML = picked.map((i, k) => { const t = bank[i]; return `<button class="tile" data-k="${k}"><span class="te">${t.th}</span>${t.rh ? `<span class="ro">${t.rh}</span>` : ""}</button>`; }).join("");
    document.querySelectorAll("#bank .tile").forEach(b => b.classList.toggle("used", picked.includes(+b.dataset.i)));
    document.querySelectorAll("#ans .tile").forEach(b => b.onclick = () => { picked.splice(+b.dataset.k, 1); redraw(); });
    $("#s-check").disabled = !picked.length;
  };
  document.querySelectorAll("#bank .tile").forEach(b => b.onclick = () => { const i = +b.dataset.i; if (!picked.includes(i)) { picked.push(i); redraw(); } });
  $("#s-check").onclick = () => {
    const got = picked.map(i => bank[i].p).join(" ").replace(/[.,?!]/g, "");
    const want = tiles.map(t => t.p).join(" ").replace(/[.,?!]/g, "");
    const ok = got === want;
    scoreEx(e, ok, e.id);
    answerFoot(ok, e, `<div>${rubyH(it)}</div><small>${esc(it.ja)}</small>`, e.id);
    Audio_.play(e.id);
    document.querySelectorAll(".tile").forEach(b => b.disabled = true);
  };
}

/* ---- 問題集の問題 ---- */
function wbEx(e) {
  const q = e.q, ai = q.ai ? item(q.ai) : null, qi = q.qi ? item(q.qi) : null;
  const head = `<div class="qhint">${esc(q.ins || "")}</div>`;
  const qText = q.qh ? `<div class="prompt-ja" style="font-size:18px">${q.qh}</div>` : "";
  const qAudio = qi ? (q.kind === "listen" ? `<div class="listen-c">${spkBtn(q.qi, "bigspk")}<button class="slow" data-say="${q.qi}" data-slow="1" aria-label="ゆっくり">${I.turtle}</button></div>`
    : `<div class="prompt">${spkBtn(q.qi)}<div>${teH(qi)}<br>${roH(qi)}</div></div>`) : "";
  const done = ok => {
    if (!ok) S.miss["wb:" + e.key] = (S.miss["wb:" + e.key] || 0) + 1;
    scoreEx(e, ok, null);
    answerFoot(ok, e, `${ai ? `<div>${teH(ai)}</div><div>${roH(ai)}</div>` : ""}${q.a ? `<small>${esc(q.a)}</small>` : ""}`);
    if (q.ai) Audio_.play(q.ai);
  };
  if (q.ch && q.ans != null) {
    sessShell(`${head}${qAudio}${qText}<div class="opts">${q.ch.map((c, i) => `<button class="opt" data-i="${i}"><span class="k">${"ABCDEFGH"[i]}</span><span>${c}</span></button>`).join("")}</div>`, checkFoot());
    if (qi) autoSay(q.qi);
    let sel = null;
    document.querySelectorAll(".opt").forEach(b => b.onclick = () => { document.querySelectorAll(".opt").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); sel = +b.dataset.i; $("#s-check").disabled = false; });
    $("#s-check").onclick = () => { const ok = sel === q.ans; document.querySelectorAll(".opt").forEach(b => { const i = +b.dataset.i; if (i === q.ans) b.classList.add("ok"); else if (i === sel) b.classList.add("bad"); }); done(ok); };
    return;
  }
  const words = ai ? ai.p.split(/\s+/) : [];
  if (ai && words.length >= 2 && words.length <= 9) {
    // 並べかえで答える
    const fake = { id: q.ai, pool: Object.keys(C.items).filter(k => k[0] === "q").slice(0, 400) };
    const it = ai;
    const tiles = it.p.split(/\s+/).map(w => ({ p: w }));
    const have = new Set(tiles.map(t => t.p)), extra = [];
    for (const x of shuffle(fake.pool)) { const w = shuffle(item(x).p.split(/\s+/)).find(w => !have.has(w) && w.length > 1); if (w) { extra.push({ p: w }); have.add(w); } if (extra.length >= 3) break; }
    const bank = shuffle(tiles.concat(extra)).map((t, i) => ({ ...t, i }));
    sessShell(`${head}${qAudio}${qText}<div class="answer-area" id="ans"></div><div class="bank" id="bank">${bank.map(t => `<button class="tile" data-i="${t.i}"><span class="te">${esc(t.p)}</span></button>`).join("")}</div>`, checkFoot());
    if (qi) autoSay(q.qi);
    const picked = [];
    const redraw = () => {
      $("#ans").innerHTML = picked.map((i, k) => `<button class="tile" data-k="${k}"><span class="te">${esc(bank[i].p)}</span></button>`).join("");
      document.querySelectorAll("#bank .tile").forEach(b => b.classList.toggle("used", picked.includes(+b.dataset.i)));
      document.querySelectorAll("#ans .tile").forEach(b => b.onclick = () => { picked.splice(+b.dataset.k, 1); redraw(); });
      $("#s-check").disabled = !picked.length;
    };
    document.querySelectorAll("#bank .tile").forEach(b => b.onclick = () => { const i = +b.dataset.i; if (!picked.includes(i)) { picked.push(i); redraw(); } });
    $("#s-check").onclick = () => { const strip = s => s.replace(/[.,?!]/g, ""); done(strip(picked.map(i => bank[i].p).join(" ")) === strip(it.p)); document.querySelectorAll(".tile").forEach(b => b.disabled = true); };
    return;
  }
  // 自分で考えてから答えを見る
  sessShell(`${head}${qAudio}${qText}<div class="muted">頭の中で（または声に出して）答えてから、答えを見よう。</div><div id="rv"></div>`,
    `<button class="btn" id="s-show">答えを見る</button>`);
  if (qi) autoSay(q.qi);
  $("#s-show").onclick = () => {
    $("#rv").innerHTML = `<div class="reveal">${ai ? `${spkBtn(q.ai)} ${teH(ai)}<br>${roH(ai)}` : ""}${q.a ? `<div style="margin-top:6px">${esc(q.a)}</div>` : ""}</div>`;
    if (q.ai) Audio_.play(q.ai);
    $("#sf").innerHTML = `<div class="selfgrade"><button class="btn ghost" id="g-no">まだ</button><button class="btn" id="g-ok">言えた</button></div>`;
    $("#g-no").onclick = () => { S.miss["wb:" + e.key] = (S.miss["wb:" + e.key] || 0) + 1; scoreEx(e, false, null); nextEx(); };
    $("#g-ok").onclick = () => { scoreEx(e, true, null); Audio_.tone("ok"); nextEx(); };
  };
}

function finish() {
  const acc = SS.right + SS.wrong ? Math.round(SS.right / (SS.right + SS.wrong) * 100) : 100;
  const bonus = SS.kind === "lesson" ? 10 : SS.kind === "review" ? 5 : 5;
  const xp = SS.xp + bonus;
  addXp(xp);
  if (SS.lesson) { S.done[SS.lesson.id] = Math.max(S.done[SS.lesson.id] || 0, acc); SS.lesson.items.forEach(learn); }
  if (SS.wb) S.wbDone[SS.wb] = Math.max(S.wbDone[SS.wb] || 0, acc);
  S.last = Date.now(); S.lastSave = Date.now();
  scheduleSave();
  const secs = Math.round((Date.now() - SS.t0) / 1000);
  const goalHit = (S.xp[today()] || 0) >= S.set.goal;
  Audio_.tone("done");
  const onDone = SS.onDone;
  $("#sess").innerHTML = `<div class="done"><div class="donemascot">🦚</div>
    <div class="perfect">${acc === 100 ? "PERFECT!" : acc >= 80 ? "すばらしい！" : "クリア！"}</div>
    <div class="burst te">శభాష్!</div><div class="muted">シャバーシュ！＝よくやった</div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><span class="xppill">⚡ +${xp} XP</span><span class="xppill" style="background:var(--ok-soft);color:var(--ok-dark)">🎯 ${acc}%</span><span class="xppill" style="background:var(--sky-soft);color:var(--sky-dark)">⏱ ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}</span></div>
    ${goalHit ? `<div class="card" style="width:100%;display:flex;gap:8px;align-items:center;justify-content:center">${I.flame}<b>今日の目標を達成！ 連続 ${streak()} 日</b></div>` : `<div class="muted">今日の目標まで あと ${Math.max(0, S.set.goal - (S.xp[today()] || 0))} XP</div>`}
    <button class="btn" id="s-end" style="width:100%">つづける</button></div>`;
  $("#s-end").onclick = () => { closeSession(); if (onDone) onDone(); };
}


/* ============ 絵文字 → 3Dイラスト（Fluent Emoji 3D, MIT） ============ */
let EMO = null, EMO_RE = null;
const emoHex = g => [...g].map(c => c.codePointAt(0)).filter(c => c !== 0xfe0f).map(c => c.toString(16)).join("-");
async function loadEmoji() {
  try { const list = await fetch("data/emoji.json").then(r => r.json()); EMO = new Set(list); } catch (e) { EMO = new Set(); return; }
  EMO_RE = /(\p{Extended_Pictographic}(️|‍\p{Extended_Pictographic}️?)*)/gu;
  emojify(document.body);
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => emojify(n.nodeType === 3 ? n.parentNode : n)))).observe(document.body, { childList: true, subtree: true });
}
function emojify(root) {
  if (!EMO_RE || !root || root.nodeType !== 1 || root.closest?.("input,textarea,script,style")) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), hits = [];
  while (w.nextNode()) { const t = w.currentNode; if (EMO_RE.test(t.nodeValue)) hits.push(t); EMO_RE.lastIndex = 0; }
  hits.forEach(t => {
    if (!t.parentNode || t.parentNode.closest("input,textarea,script,style,svg")) return;
    const f = document.createDocumentFragment(); let last = 0, s = t.nodeValue, m; EMO_RE.lastIndex = 0;
    while ((m = EMO_RE.exec(s))) {
      const h = emoHex(m[0]); if (!EMO.has(h)) continue;
      f.append(s.slice(last, m.index)); const img = document.createElement("img"); img.className = "e3d"; img.alt = m[0]; img.src = "img/e/" + h + ".png"; img.decoding = "async"; f.append(img); last = m.index + m[0].length;
    }
    if (last) { f.append(s.slice(last)); t.parentNode.replaceChild(f, t); }
  });
}
/* ============ 起動 ============ */
(async function boot() {
  loadLocal();
  loadEmoji();
  try { await loadData(); } catch (e) { $("#app").innerHTML = `<div class="loading">データを読み込めませんでした。ページを開き直してください。</div>`; return; }
  render();
  connectStore();
  if (!Cloud.init() && window.FIREBASE_CONFIG) showLogin("通信できないため、この端末だけで使います");
  try { navigator.storage?.persist?.(); } catch (e) {}
  if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(() => {});
  document.addEventListener("visibilitychange", () => { if (document.hidden) { flush(); Cloud.push(); } });
})();
